services:
  db:
    image: ghcr.io/chenghanlee/tips-postgres:18.6-pgvector0.8.6-textsearch1.4.0
    build: ./db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
