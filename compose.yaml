services:
  db:
    image: ghcr.io/chenghanlee/tips-postgres:18.6-pgvector0.8.6-textsearch1.4.0
    build: ./db
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch", "-c", "max_connections=${TIPS_DB_MAX_CONNECTIONS:-500}"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${TIPS_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
