services:
  db:
    image: ghcr.io/chenghanlee/tips-postgres:18.6-pgvector0.8.6-textsearch1.4.0
    build: ./db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${TIPS_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
  app:
    image: ${TIPS_RELEASE_IMAGE:-tips-release:local}
    build:
      context: .
      args:
        RELEASE_REVISION: ${RELEASE_REVISION:-local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=ecto://postgres:postgres@db/tips_release
      # Omit when unset so runtime.exs raises its missing-secret error.
      - SECRET_KEY_BASE
      - PHX_HOST=${PHX_HOST:-localhost}
      - PORT=4000
    ports:
      - "127.0.0.1:${TIPS_APP_PORT:-4300}:4000"
volumes:
  postgres_data:
