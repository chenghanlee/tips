name: Dexter
# Tooling changes run the full suite; harness-only changes run real-daemon integration.
# A clean CI runner builds the binary for either scope. Markdown-only changes skip it.
on:
  pull_request:
    paths:
      - 'agent/lsp/**'
      - 'agent/teams/**'
      - '.github/workflows/dexter.yml'
      - '!**.md'
  push:
    branches: [main]
    paths:
      - 'agent/lsp/**'
      - 'agent/teams/**'
      - '.github/workflows/dexter.yml'
      - '!**.md'
permissions:
  contents: read
jobs:
  dexter:
    name: dexter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select Dexter coverage
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="origin/$GITHUB_BASE_REF...HEAD"
          elif [ -z "$BEFORE" ] || ! git rev-parse --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            echo 'Push base unavailable; selecting full Dexter coverage.'
            echo 'full=true' >> "$GITHUB_OUTPUT"
            exit 0
          else
            range="$BEFORE..HEAD"
          fi
          if git diff --quiet --no-renames "$range" -- agent/lsp .github/workflows/dexter.yml ':(exclude)*.md'; then
            full=false
          else
            status=$?
            [ "$status" -eq 1 ] || exit "$status"
            full=true
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - name: Fetch the pinned Dexter source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: remoteoss/dexter
          ref: c4b62b788bbe38f0af507a79f0d6de46dd812b51
          path: tmp/dexter-upstream
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: tmp/dexter-upstream/go.sum
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1'
          version-type: strict
      - name: Build the pinned source plus the local patch
        run: agent/lsp/dexter/build.sh tmp/dexter-upstream --keep tmp/dexter-source
      - name: Check the packaged binary identity
        run: bash agent/lsp/dexter/build.sh --check
      - name: Go tests, including the real-daemon integration
        if: steps.scope.outputs.full == 'true'
        working-directory: tmp/dexter-source
        run: go test ./...
      - name: Fetch the Elixir sources matching the toolchain
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elixir-lang/elixir
          ref: v1.20.4
          path: tmp/elixir-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build script safety against running daemons and failed inspection
        if: steps.scope.outputs.full == 'true'
        run: python3 agent/lsp/dexter/test_build.py
      - name: Team provisioning and client stop against the built binary and real sources
        env:
          TIPS_TEST_REAL_DEXTER: ${{ github.workspace }}/agent/lsp/dexter
          DEXTER_ELIXIR_LIB_ROOT: ${{ github.workspace }}/tmp/elixir-source/lib
        run: python3 -m unittest discover -s agent/teams/tests -t agent/teams -p 'test_*.py' -k real_daemons -v
