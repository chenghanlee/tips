name: Dexter
# Not a required status check (ruleset 'Reviewed main' requires checks, tips/independent-review
# and release), so a path-skipped run leaves nothing pending. Elixir-only changes skip it.
on:
  pull_request:
    paths:
      - 'agent/lsp/**'
      - 'agent/teams/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'agent/lsp/**'
      - 'agent/teams/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  dexter:
    name: dexter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the pinned Dexter source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: remoteoss/dexter
          ref: c4b62b788bbe38f0af507a79f0d6de46dd812b51
          path: tmp/dexter-upstream
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: tmp/dexter-upstream/go.sum
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1'
          version-type: strict
      - name: Build the pinned source plus the local patch
        run: agent/lsp/dexter/build.sh tmp/dexter-upstream --keep tmp/dexter-source
      - name: Check the packaged binary identity
        run: |
          agent/lsp/dexter/vendor/dexter version
          ! agent/lsp/dexter/vendor/dexter version | grep -q 'local_build_id dev'
      - name: Go tests, including the real-daemon integration
        working-directory: tmp/dexter-source
        run: go test ./...
      - name: Fetch the Elixir sources matching the toolchain
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elixir-lang/elixir
          ref: v1.20.4
          path: tmp/elixir-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build script safety against running daemons and failed inspection
        run: python3 agent/lsp/dexter/test_build.py
      - name: Team provisioning and client stop against the built binary and real sources
        env:
          TIPS_TEST_REAL_DEXTER: ${{ github.workspace }}/agent/lsp/dexter
          DEXTER_ELIXIR_LIB_ROOT: ${{ github.workspace }}/tmp/elixir-source/lib
        run: python3 -m unittest discover -s agent/teams/tests -t agent/teams -p 'test_*.py' -k real_daemons -v
