name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
  pull-requests: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
      PGPORT: '5433'
      TIPS_DB_SUFFIX: _ci
      TIPS_TEST_PORT: '4036'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan introduced commits for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_docs.py
      - name: Install Python check tools
        run: python -m pip install ruff==0.16.8 pyright==1.1.413
      - name: Lint agent harness and Dexter client
        run: ruff check agent/teams agent/lsp/dexter
      - name: Check agent harness and Dexter client formatting
        run: ruff format --check agent/teams agent/lsp/dexter
      - name: Type-check agent harness and Dexter client
        run: pyright --project agent/teams/pyproject.toml
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1'
          version-type: strict
      - name: Check agent harness and Dexter client
        run: |
          python3 -m unittest discover -s agent/teams/tests -t agent/teams -p 'test_*.py'
          python3 -m unittest discover -s agent/lsp/dexter/tests -v
          elixir agent/lsp/dexter/tests/owners_test.exs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-otp29.1-elixir1.20.4-test-${{ hashFiles('mix.lock') }}
      - name: Start extension-enabled PostgreSQL
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin && docker compose pull db; then
            echo 'Using the published database image'
          else
            docker compose build db
          fi
          docker compose up -d --wait --no-build db
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          chrome-version: '153.0.8010.52'
          install-chromedriver: true
      - name: Check browser and driver pins
        env:
          TIPS_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          TIPS_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          chrome_version=$("$TIPS_CHROME_BINARY" --version)
          driver_version=$("$TIPS_CHROMEDRIVER" --version)
          printf '%s\n%s\n' "$chrome_version" "$driver_version"
          test "$(printf '%s' "$chrome_version" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')" = '153.0.8010.52'
          test "$(printf '%s' "$driver_version" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')" = '153.0.8010.52'
          printf 'TIPS_CHROME_BINARY=%s\nTIPS_CHROMEDRIVER=%s\n' "$TIPS_CHROME_BINARY" "$TIPS_CHROMEDRIVER" >> "$GITHUB_ENV"
      - name: Allow Chrome to create its sandbox
        # Ubuntu restricts user namespaces for binaries outside its packaged paths.
        run: |
          sudo tee /etc/apparmor.d/tips-chrome-for-testing > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile tips-chrome-for-testing "$TIPS_CHROME_BINARY" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/tips-chrome-for-testing
      - name: Check sandboxed Chrome startup
        run: timeout 20 "$TIPS_CHROME_BINARY" --headless --disable-gpu --dump-dom about:blank
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix assets.setup && mix assets.build
      - name: Check migration rollback and reapply
        run: mix ecto.create && mix ecto.migrate && mix ecto.rollback --all && mix ecto.migrate
      - run: mix test --include browser --trace
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-screenshots
          path: screenshots/
          if-no-files-found: ignore
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_REVISION: ${{ github.sha }}
      TIPS_RELEASE_IMAGE: tips-release-smoke:ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build release
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ env.TIPS_RELEASE_IMAGE }}
          build-args: RELEASE_REVISION=${{ env.RELEASE_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare extension-enabled PostgreSQL image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin && docker compose pull db; then
            echo 'Using the published database image'
          else
            docker compose build db
          fi
      - name: Smoke release migration, health, and restart
        run: scripts/release_smoke.sh --skip-build
