name: Database image
on:
  pull_request:
    paths:
      - 'db/**'
      - 'scripts/db_smoke.sh'
      - 'compose.yaml'
      - '.github/workflows/db-image.yml'
  push:
    branches: [main]
    paths:
      - 'db/**'
      - 'scripts/db_smoke.sh'
      - 'compose.yaml'
      - '.github/workflows/db-image.yml'
permissions:
  contents: read
  packages: write
jobs:
  db-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_IMAGE: ghcr.io/chenghanlee/tips-postgres:18.6-pgvector0.8.6-textsearch1.4.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and smoke native amd64 image
        run: scripts/db_smoke.sh
      - name: Publish the verified image to private GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$DB_IMAGE"
          docker image inspect "$DB_IMAGE" --format '{{json .RepoDigests}}'
