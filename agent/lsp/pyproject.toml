# Maintain the runtime and build entry points; historical probes are excluded.
# Python rules match agent-team-harness's Python profile and agent/teams.
[tool.ruff]
extend = "../teams/pyproject.toml"
include = [
  "experiments/codex-elixirls-v2/bundle.py",
  "experiments/codex-elixirls-v2/build_bundle.py",
  "experiments/codex-elixirls-v2/neovim_launcher.py",
  "experiments/codex-elixirls-v2/neovim_prepare.py",
  "experiments/codex-elixirls-v2/tests/*.py",
  # Gate probes: Ruff only, not strict Pyright (see CHECKS.md).
  "experiments/codex-elixirls-v2/hookfree_recovery_gate.py",
  "experiments/codex-elixirls-v2/seven_ops_acceptance.py",
  "experiments/codex-elixirls-v2/hooks_list_gate.py",
]

[tool.ruff.lint.extend-per-file-ignores]
"experiments/codex-elixirls-v2/tests/*.py" = ["S101"]

[tool.pyright]
include = [
  "experiments/codex-elixirls-v2/bundle.py",
  "experiments/codex-elixirls-v2/build_bundle.py",
  "experiments/codex-elixirls-v2/neovim_launcher.py",
  "experiments/codex-elixirls-v2/neovim_prepare.py",
  "experiments/codex-elixirls-v2/tests",
]
# The preparation tests import the module from its directory.
extraPaths = ["experiments/codex-elixirls-v2"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
