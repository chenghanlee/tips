# Agent launch settings. Changes apply to newly started sessions.
# An empty model uses the client's configured default.
# GitHub calls name this repository instead of reading it from a checkout. Trusted state
# lives beside the main checkout, in <checkout parent>/agent_teams/<repository name>/.
# The dispatcher adapter may read the listed projects, add items to them and set only the
# listed fields.
[github]
repository = "chenghanlee/tips"

[github.projects]
15 = ["Status", "Kind", "Agent"]

[team]
# Each allocation clones this URL itself.
clone_url = "https://github.com/chenghanlee/tips.git"
# Fixed argv that cleanup (end of `team.py stop`, and `team.py cleanup`) uses to list and
# drop a retired team's databases: an absolute psql and the compose database's development
# connection. No project file is read.
psql = ["/opt/homebrew/bin/psql", "postgresql://postgres:postgres@127.0.0.1:5433/postgres"]
# Validation rejects database names that overlap another slot's numbered partitions or
# exceed PostgreSQL's 63 bytes.
max_teams = 4
port_base = 4100
port_stride = 10
postgres_port = 5433
db_suffix_prefix = "_team"

[timeouts]
launch_seconds = 120
shutdown_seconds = 15
shell_seconds = 15
dexter_startup_seconds = 60
checks_minutes = 30
# How long start, review, reset or stop waits for another one to finish.
lock_seconds = 60

[launch]
codex_approval = "never"
claude_permission_mode = "auto"
# agy's user settings file. Before an agy client starts, the launcher adds its allocation
# root to `trustedWorkspaces` there (agy asks "Do you trust this folder?" per folder, and a
# trusted parent does not cover children); stop removes the entry with the allocation.
agy_settings = "~/.gemini/antigravity-cli/settings.json"

# agent/teams/dispatch always starts this agent as Claude. It compacts at
# compact_percent because each message starts a new turn with the full conversation.
[dispatcher]
model = "claude-fable-5-1"
effort = "medium"
compact_percent = 35

# Briefs name agents with `Implementer: <entry>` and `Required reviews: <entry>, <entry>`.
# Each launch gets a database suffix (db_suffix_prefix + slot + "g" + generation + db_suffix;
# db_suffix must start with a non-digit)
# and a test port (port_base + slot * port_stride + port_offset).
# `persona` adds optional text to the launch prompt.
[agents.opus-implementer]
role = "implementer"
kind = "claude"
model = "claude-opus-5-5"
effort = "high"
db_suffix = "_opus"
port_offset = 0

[agents.haiku-implementer]
role = "implementer"
kind = "claude"
model = "claude-haiku-5-5"
effort = "high"
db_suffix = "_haiku"
port_offset = 1

[agents.sol-tester]
role = "tester"
kind = "codex"
model = "gpt-6.1-sol"
effort = "xhigh"
db_suffix = "_sol"
port_offset = 2

[agents.fable-architect]
role = "architect"
kind = "claude"
model = "claude-fable-5-1"
effort = "high"
db_suffix = "_fable"
port_offset = 3

[agents.astra-architect]
role = "architect"
kind = "codex"
model = "gpt-6-astra"
effort = "xhigh"
db_suffix = "_astra"
port_offset = 4

# The UX design team (README.md#ux-design-team): one UX designer and one or more graphic
# designers, named on a brief by `UX: <entry>` and `Graphic designers: <entry>, ...`.
# Graphic designers generate images with their client's own image skill.
[agents.opus-ux]
role = "ux-designer"
kind = "claude"
model = "claude-opus-5-5"
effort = "high"
db_suffix = "_ux"
port_offset = 5

[agents.astra-graphic]
role = "graphic-designer"
kind = "codex"
model = "gpt-6-astra"
effort = "medium"
db_suffix = "_astrag"
port_offset = 6

# Gemini through the agy CLI; the model slug carries its own effort level.
[agents.argon-graphic]
role = "graphic-designer"
kind = "agy"
model = "gemini-4-argon-medium"
effort = "medium"
db_suffix = "_argon"
port_offset = 7
