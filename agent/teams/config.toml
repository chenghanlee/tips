# Agent launch settings. Changes apply to newly started sessions.
# An empty model uses the client's configured default.
[team]
# Current suffixes support at most nine teams; validation rejects partition collisions.
max_teams = 4
workspace_prefix = "tips-team"
port_base = 4100
port_stride = 10
postgres_port = 5433
db_suffix_prefix = "_team"

[timeouts]
launch_seconds = 120
shutdown_seconds = 15
shell_seconds = 15
dexter_startup_seconds = 60
checks_minutes = 30

[launch]
codex_approval = "never"
claude_permission_mode = "auto"

[roles.dev]
kind = "claude"
model = "claude-opus-5-5"
effort = "high"
db_suffix = "_dev"
port_offset = 0

[roles.test]
kind = "codex"
model = "gpt-6.1-sol"
effort = "high"
db_suffix = "_test"
port_offset = 1
