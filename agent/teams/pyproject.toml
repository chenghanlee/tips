[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["B", "C4", "C90", "D100", "D104", "E", "F", "I", "N", "PT", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# The suite is unittest by design: CI runs `python -m unittest`, so assertRaises is correct.
"tests/**/*.py" = ["S101", "PT027"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["*.py", "tests"]
extraPaths = ["../.."]
exclude = [".venv", ".ruff_cache", ".pytest_cache", "dist"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

# The dispatcher adapter's only dependency. requirements.lock pins it and every
# transitive package with hashes; regenerate with the command in development.md.
[project]
name = "tips-agent-teams"
version = "0"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0"]
